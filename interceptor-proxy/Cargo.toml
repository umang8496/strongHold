[package]
name = "interceptor-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }

# Standard HTTP types (Uri, HeaderMap, Request, Response, StatusCode)
# We use this directly so we don't depend on a full web server for basic domain logic
http = "1.1"

# Ergonomic error handling for library modules
thiserror = "1.0"

# Hyper 1.x core HTTP protocol engine
hyper = { version = "1.4", features = ["full"] }

# Hyper utilities: IO bridging between Tokio and Hyper, connection pools
hyper-util = { version = "0.1", features = ["full"] }

# Body streaming utilities (Full, Empty, combinators)
http-body-util = "0.1"

# Reference-counted contiguous byte buffers
bytes = "1.6"

# Generating correlation IDs
uuid = { version = "1.8", features = ["v4", "fast-rng"] }

# Serialization and JSON dynamic manipulation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper-rustls = { version = "0.27.10", features = ["native-tokio", "http1", "http2", "webpki-roots"] }
